# Billing: an ordinary web service with no Akka.NET (ADR 0004), so no cluster label, no
# management port and no service account of its own. Two replicas: its inbox and outbox make
# concurrent instances safe (section 16.3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: billing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: billing
          image: ghcr.io/ohmline/billing:0.9.0
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef:
                name: ohmline-settings
          env:
            - name: OTEL_SERVICE_NAME
              value: billing
            - name: ConnectionStrings__billing
              valueFrom:
                secretKeyRef: { name: ohmline-db, key: billing }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
