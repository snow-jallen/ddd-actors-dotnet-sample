# The Device Gateway: members of the same cluster with the role gateway, holding the chargers'
# WebSockets. It hosts no shard, so a rolling update moves no entity; what it moves is
# connections, which it closes in batches on the way out (section 21.7).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        akka-cluster: ohmline
    spec:
      serviceAccountName: ohmline-akka
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
      containers:
        - name: gateway
          image: ghcr.io/ohmline/gateway:0.9.0
          ports:
            - { name: http, containerPort: 8080 }
            - { name: remoting, containerPort: 4053 }
            - { name: management, containerPort: 8558 }
          envFrom:
            - configMapRef:
                name: ohmline-settings
          env:
            - name: Akka__Remote__PublicHostname
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: OTEL_SERVICE_NAME
              value: gateway
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.instance.id=$(POD_NAME)
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
