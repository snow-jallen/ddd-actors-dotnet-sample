# The identity of the cluster's pods, the node's and the gateway's. Kubernetes discovery lists
# the pods labelled akka-cluster=ohmline; the split-brain resolver takes a lease, a custom
# resource in the akka.io group. Nothing else: no secrets, no other namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ohmline-akka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ohmline-akka
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["akka.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ohmline-akka
subjects:
  - kind: ServiceAccount
    name: ohmline-akka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ohmline-akka
