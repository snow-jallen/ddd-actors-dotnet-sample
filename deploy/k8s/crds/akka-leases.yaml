# The lease the split-brain resolver takes (lease-majority, section 21.6), as a custom resource
# in the akka.io group: the CRD of Akka.Coordination.KubernetesApi. Installed once per
# Kubernetes cluster, by its administrator, never by Ohmline's overlays: a CRD is cluster-wide,
# and deleting it would delete every lease of every application that uses it.
#   kubectl apply -f deploy/k8s/crds/akka-leases.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: leases.akka.io
spec:
  group: akka.io
  scope: Namespaced
  names:
    kind: Lease
    listKind: LeaseList
    singular: lease
    plural: leases
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                owner:
                  type: string
                version:
                  type: string
                time:
                  type: integer
