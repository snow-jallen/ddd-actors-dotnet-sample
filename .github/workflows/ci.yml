# Every push and pull request: build with warnings as errors, the fast tests, the tests with
# containers, the driver app's Android head, and the vulnerability audit (section 21.4).
# Every Monday, or by hand: every chNN-sMM tag of the book, from a clean checkout of each.
# Called by release-please.yml for a release: all of that, then the images (section 21.5).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: The vX.Y.Z tag release-please just created; its images are published.
        type: string
        required: true
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The TestKit's timeouts, three times longer on a shared runner (ActorTestConfig, 10.4).
  OHMLINE_TIMEFACTOR: 3

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer reads the version from the latest vX.Y.Z tag.
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Ohmline.slnx --locked-mode
      - run: dotnet build Ohmline.slnx -warnaserror --no-restore

  unit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Ohmline.slnx --locked-mode
      - run: >-
          dotnet test --solution Ohmline.slnx --no-restore
          -- --filter-not-trait "Category=Integration" --filter-not-trait "Category=System"

  integration:
    needs: build
    runs-on: ubuntu-latest # Docker is on the runner: Testcontainers and Aspire start Postgres.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Ohmline.slnx --locked-mode
      - run: >-
          dotnet test --solution Ohmline.slnx --no-restore
          -- --filter-trait "Category=Integration" --filter-trait "Category=System"

  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet workload install maui-android
      # The Android platform and build tools the head targets, into the runner's Android SDK.
      - run: >-
          dotnet build mobile/Ohmline.Mobile/Ohmline.Mobile.csproj -t:InstallAndroidDependencies
          -f net11.0-android -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=True
      - run: dotnet restore mobile/Ohmline.Mobile.slnx --locked-mode
      - run: dotnet build mobile/Ohmline.Mobile.slnx -warnaserror --no-restore

  # NuGetAudit is off in Directory.Build.props, so that an advisory published tomorrow never
  # breaks the build of an old tag. The audit runs here instead, on today's advisories.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Ohmline.slnx --locked-mode
      - run: |
          dotnet list Ohmline.slnx package --vulnerable --include-transitive | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then exit 1; fi

  # Every section of the book still builds and passes its tests, from a clean checkout of its
  # tag (tools/verify-tags.sh). Hours, not minutes: weekly and on demand only.
  verify-tags:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: >-
          dotnet build mobile/Ohmline.Mobile/Ohmline.Mobile.csproj -t:InstallAndroidDependencies
          -f net11.0-android -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=True
      - run: tools/verify-tags.sh

  # A release's images, built from its tag, so MinVer tags them X.Y.Z (section 21.5). A tag
  # that release-please creates with the workflow's token starts no workflow of its own, which
  # is why release-please.yml calls this one instead of a push of the tag.
  images:
    if: inputs.release-tag != ''
    needs: [unit, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { project: src/Ohmline.Node, image: node }
          - { project: src/DeviceGateway/Ohmline.DeviceGateway, image: gateway }
          - { project: src/Billing/Ohmline.Billing, image: billing }
          - { project: src/Ohmline.Migrator, image: migrator }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ${{ matrix.image }} to ghcr.io
        env:
          OWNER: ${{ github.repository_owner }}
        run: >-
          dotnet publish ${{ matrix.project }} -c Release -t:PublishContainer
          -p:ContainerRegistry=ghcr.io -p:ContainerRepository="${OWNER,,}/${{ matrix.image }}"
